AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Bloodline — Singapore Blood Supply Crisis-Resilience Platform

Globals:
  Function:
    Runtime: python3.13
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        DONORS_TABLE: !Ref DonorsTable
        DONATIONS_TABLE: !Ref DonationsTable
        PREDICTIONS_TABLE: !Ref PredictionsTable
        BLOOD_STOCK_TABLE: !Sub bloodline-blood-stock-${Stage}
        BLOOD_DRIVES_TABLE: !Ref BloodDrivesTable
        BOOKINGS_TABLE: !Ref BookingsTable
        ALERTS_TABLE: !Ref AlertsTable
        DONATION_SLOTS_TABLE: !Ref DonationSlotsTable
        SLOT_BOOKINGS_TABLE: !Ref SlotBookingsTable
        HOSPITALS_TABLE: !Ref HospitalsTable
        PREDICTIONS_BUCKET: !Ref PredictionsCacheBucket
        SURGE_ALERT_TOPIC: !Ref SurgeAlertTopic
        POWERTOOLS_SERVICE_NAME: bloodline
        LOG_LEVEL: INFO

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  SenderEmail:
    Type: String
    Default: ""
    Description: SES-verified "from" address used for surge alert emails (leave blank to disable email)
  AppUrl:
    Type: String
    Default: ""
    Description: Optional override for the surge-email call-to-action link (e.g. a custom domain). Leave blank to use the CloudFront PWA URL.
  VapidPublicKey:
    Type: String
    Default: ""
    Description: VAPID public key (base64url) for Web Push. Must match the key embedded in the frontend.
  VapidPrivateKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: VAPID private key (base64url) for signing Web Push JWTs.
  VapidSubject:
    Type: String
    Default: "mailto:bloodlineapps@gmail.com"
    Description: "VAPID 'sub' contact (mailto or https) sent to push services."
  EnableSms:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Send surge alerts by SMS via SNS. Billable + requires SNS SMS production access and (for SG) a registered Sender ID. Off by default.
  SmsSenderId:
    Type: String
    Default: ""
    Description: Optional SNS SMS Sender ID for outbound surge texts (Singapore requires a registered Sender ID for reliable delivery)
  LtaAccountKey:
    Type: String
    Default: "SGVWAY+7SwSN1dTLV9kN4Q=="
    NoEcho: true
    Description: LTA DataMall AccountKey used to fetch live traffic incidents for the HSA ops feed

Conditions:
  # When AppUrl is left blank, surge emails link to the CloudFront-hosted PWA.
  HasCustomAppUrl: !Not [!Equals [!Ref AppUrl, ""]]

# ---------------------------------------------------------------------------
# API GATEWAY
# ---------------------------------------------------------------------------
Resources:

  BloodlineApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub bloodline-api-${Stage}
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuth
        Authorizers:
          CognitoAuth:
            UserPoolArn: !GetAtt DonorUserPool.Arn
        AddDefaultAuthorizerToCorsPreflight: false

  ApiGatewayResponse4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_4XX
      RestApiId: !Ref BloodlineApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

  ApiGatewayResponse5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      ResponseType: DEFAULT_5XX
      RestApiId: !Ref BloodlineApi
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"

# ---------------------------------------------------------------------------
# COGNITO
# ---------------------------------------------------------------------------

  DonorUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub bloodline-donors-${Stage}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      Schema:
        - Name: blood_type
          AttributeDataType: String
          Mutable: true
        - Name: postal_code
          AttributeDataType: String
          Mutable: true

  DonorUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub bloodline-spa-${Stage}
      UserPoolId: !Ref DonorUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  HSAAdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: HSAAdmin
      UserPoolId: !Ref DonorUserPool
      Description: HSA staff with admin-level access

# ---------------------------------------------------------------------------
# FRONTEND — S3 + CLOUDFRONT
# ---------------------------------------------------------------------------

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bloodline-frontend-${Stage}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub bloodline-oac-${Stage}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          ViewerProtocolPolicy: redirect-to-https
          TargetOriginId: S3Origin
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          AllowedMethods: [GET, HEAD, OPTIONS]
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

# ---------------------------------------------------------------------------
# S3 — BACKEND PREDICTIONS CACHE
# ---------------------------------------------------------------------------

  PredictionsCacheBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub bloodline-predictions-${Stage}-${AWS::AccountId}

# ---------------------------------------------------------------------------
# DYNAMODB TABLES
# ---------------------------------------------------------------------------

  DonorsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-donors-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donorId
          AttributeType: S
      KeySchema:
        - AttributeName: donorId
          KeyType: HASH

  DonationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-donations-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donorId
          AttributeType: S
        - AttributeName: donatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: donorId
          KeyType: HASH
        - AttributeName: donatedAt
          KeyType: RANGE

  PredictionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-predictions-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bloodType
          AttributeType: S
        - AttributeName: forecastDate
          AttributeType: S
      KeySchema:
        - AttributeName: bloodType
          KeyType: HASH
        - AttributeName: forecastDate
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  BloodStockTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-blood-stock-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: bloodType
          AttributeType: S
        - AttributeName: updatedAt
          AttributeType: S
      KeySchema:
        - AttributeName: bloodType
          KeyType: HASH
        - AttributeName: updatedAt
          KeyType: RANGE

  BloodDrivesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-drives-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: driveId
          AttributeType: S
      KeySchema:
        - AttributeName: driveId
          KeyType: HASH

  BookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-bookings-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donorId
          AttributeType: S
        - AttributeName: driveId
          AttributeType: S
      KeySchema:
        - AttributeName: donorId
          KeyType: HASH
        - AttributeName: driveId
          KeyType: RANGE

  AlertsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-alerts-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: alertId
          AttributeType: S
      KeySchema:
        - AttributeName: alertId
          KeyType: HASH

  HospitalsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-hospitals-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: hospitalId
          AttributeType: S
      KeySchema:
        - AttributeName: hospitalId
          KeyType: HASH

  DonationSlotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-slots-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: slotId
          AttributeType: S
      KeySchema:
        - AttributeName: slotId
          KeyType: HASH

  SlotBookingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub bloodline-slot-bookings-${Stage}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: donorId
          AttributeType: S
        - AttributeName: slotId
          AttributeType: S
      KeySchema:
        - AttributeName: donorId
          KeyType: HASH
        - AttributeName: slotId
          KeyType: RANGE

# ---------------------------------------------------------------------------
# SNS
# ---------------------------------------------------------------------------

  SurgeAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub bloodline-surge-alerts-${Stage}

# ---------------------------------------------------------------------------
# LAMBDA FUNCTIONS
# ---------------------------------------------------------------------------

  DonorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-donors-${Stage}
      CodeUri: src/donors/
      Handler: handler.lambda_handler
      Description: Donor profile CRUD and eligibility countdown
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DonorsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DonationsTable
      Events:
        GetDonor:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/donors/me
            Method: GET
        UpdateDonor:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/donors/me
            Method: PUT

  PredictFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-predict-${Stage}
      CodeUri: src/predict/
      Handler: handler.lambda_handler
      Description: 14-day shortage forecast — serves cached data from DynamoDB, refreshes on schedule
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PredictionsTable
        - DynamoDBReadPolicy:
            TableName: !Sub bloodline-blood-stock-${Stage}
        - S3CrudPolicy:
            BucketName: !Ref PredictionsCacheBucket
      Events:
        GetForecast:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/predict/forecast
            Method: GET
        GetStatus:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/predict/status
            Method: GET
        HourlyRefresh:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Description: Refresh blood shortage forecast every hour
            Input: '{"source": "eventbridge"}'

  SurgeFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-surge-${Stage}
      CodeUri: src/surge/
      Handler: handler.lambda_handler
      Description: Break-glass surge alert activation (single HSA officer)
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DonorsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HospitalsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt SurgeAlertTopic.TopicName
      Events:
        ActivateSurge:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/surge/activate
            Method: POST
        MonitorSurge:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/surge/monitor
            Method: GET
        ReachPreview:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/surge/reach
            Method: GET
        EndSurge:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/surge/{alertId}/end
            Method: POST

  NotifyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-notify-${Stage}
      CodeUri: src/notify/
      Handler: handler.lambda_handler
      Description: Dispatches push + email alerts to eligible donors based on blood type and geo tier
      Environment:
        Variables:
          SENDER_EMAIL: !Ref SenderEmail
          # Defaults to the CloudFront PWA URL; AppUrl param overrides for a custom domain
          APP_URL: !If [HasCustomAppUrl, !Ref AppUrl, !Sub "https://${FrontendDistribution.DomainName}"]
          SMS_ENABLED: !Ref EnableSms
          VAPID_PUBLIC_KEY: !Ref VapidPublicKey
          VAPID_PRIVATE_KEY: !Ref VapidPrivateKey
          VAPID_SUBJECT: !Ref VapidSubject
          SMS_SENDER_ID: !Ref SmsSenderId
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DonorsTable
        - DynamoDBReadPolicy:
            TableName: !Ref HospitalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref AlertsTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
            # SMS publish targets a phone number, not a topic ARN, so it can't be
            # scoped to a resource — "*" is required for sns:Publish to a PhoneNumber.
            - Effect: Allow
              Action:
                - sns:Publish
              Resource: "*"
      Events:
        SurgeSNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref SurgeAlertTopic

  ScheduleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-schedule-${Stage}
      CodeUri: src/schedule/
      Handler: handler.lambda_handler
      Description: Appointment booking and blood drive management
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BloodDrivesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DonationSlotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SlotBookingsTable
      Events:
        ListMyBookings:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/schedule/bookings
            Method: GET
        ListSlots:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/slots
            Method: GET
        BookSlot:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/slots/{slotId}/book
            Method: POST
        CancelSlot:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/slots/{slotId}/book
            Method: DELETE
        ListHospitalDrives:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/hospital/drives
            Method: GET
        ListDrives:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/schedule/drives
            Method: GET
        CreateDrive:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/schedule/drives
            Method: POST
        CreateBooking:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/schedule/book
            Method: POST

  RetainFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-retain-${Stage}
      CodeUri: src/retain/
      Handler: handler.lambda_handler
      Description: Donor impact stats, milestone badges, squad leaderboards
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DonationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DonorsTable
      Events:
        GetStats:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/retain/stats
            Method: GET

  HSASyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-hsa-sync-${Stage}
      CodeUri: src/hsa-sync/
      Handler: handler.lambda_handler
      Description: Scrapes Red Cross SG blood stock every 15 minutes; serves cached data via HTTP
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub bloodline-blood-stock-${Stage}
      Events:
        SyncSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(15 minutes)
            Description: Scrape Red Cross SG blood stock levels
            Input: '{"source": "eventbridge"}'
        GetBloodStock:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/blood-stock
            Method: GET

  AdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-admin-${Stage}
      CodeUri: src/admin/
      Handler: handler.lambda_handler
      Description: HSA admin console — donor segments, drive approvals, stock overview, demand input, donation recording
      Environment:
        Variables:
          LTA_ACCOUNT_KEY: !Ref LtaAccountKey
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DonorsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DonationsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BloodDrivesTable
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
        - DynamoDBReadPolicy:
            TableName: !Sub bloodline-blood-stock-${Stage}
        - DynamoDBCrudPolicy:
            TableName: !Ref PredictionsTable
      Events:
        GetDonorSegments:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/donors/segments
            Method: GET
        GetPendingDrives:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/drives/pending
            Method: GET
        ApproveDrive:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/drives/{driveId}/approve
            Method: POST
        RejectDrive:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/drives/{driveId}/reject
            Method: POST
        GetStockOverview:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/stock
            Method: GET
        GetAllAlerts:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/alerts
            Method: GET
        GetTrafficIncidents:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/traffic-incidents
            Method: GET
        SubmitHospitalDemand:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/demand
            Method: POST
        LookupDonor:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/hospital/donor
            Method: GET
        RecordDonation:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/donations
            Method: POST

  HospitalFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-hospital-${Stage}
      CodeUri: src/hospital/
      Handler: handler.lambda_handler
      Description: Hospital portal — profile setup and blood drive submission
      Environment:
        Variables:
          HOSPITALS_TABLE: !Ref HospitalsTable
          DONATION_SLOTS_TABLE: !Ref DonationSlotsTable
          SLOT_BOOKINGS_TABLE: !Ref SlotBookingsTable
          DONORS_TABLE: !Ref DonorsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HospitalsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref DonationSlotsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SlotBookingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DonorsTable
      Events:
        CreateSlot:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/hospital/slots
            Method: POST
        ListHospitalSlots:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/hospital/slots
            Method: GET
        GetHospitalProfile:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/hospital/profile
            Method: GET
        UpdateHospitalProfile:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/hospital/profile
            Method: PUT
        ListHospitals:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/hospitals
            Method: GET

  DiagnosticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub bloodline-diagnostics-${Stage}
      CodeUri: src/diagnostics/
      Handler: handler.lambda_handler
      Description: Test panel — probes all services and triggers scheduled functions
      Timeout: 30
      Environment:
        Variables:
          HSA_SYNC_FUNCTION: !Sub bloodline-hsa-sync-${Stage}
          PREDICT_FUNCTION: !Sub bloodline-predict-${Stage}
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref DonorsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DonationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref PredictionsTable
        - DynamoDBReadPolicy:
            TableName: !Sub bloodline-blood-stock-${Stage}
        - DynamoDBReadPolicy:
            TableName: !Ref BloodDrivesTable
        - DynamoDBReadPolicy:
            TableName: !Ref BookingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref AlertsTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt SurgeAlertTopic.TopicName
        - Statement:
            - Effect: Allow
              Action:
                - events:ListRules
                - lambda:InvokeFunction
                - sts:GetCallerIdentity
              Resource: "*"
      Events:
        GetDiagnostics:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/diagnostics
            Method: GET
        TriggerFunction:
          Type: Api
          Properties:
            RestApiId: !Ref BloodlineApi
            Path: /api/v1/admin/trigger
            Method: POST

# ---------------------------------------------------------------------------
# OUTPUTS
# ---------------------------------------------------------------------------

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${BloodlineApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}

  FrontendUrl:
    Description: CloudFront distribution URL for the PWA
    Value: !Sub https://${FrontendDistribution.DomainName}

  FrontendBucketName:
    Description: S3 bucket to upload frontend build artifacts
    Value: !Ref FrontendBucket

  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref DonorUserPool

  UserPoolClientId:
    Description: Cognito App Client ID for the SPA
    Value: !Ref DonorUserPoolClient
